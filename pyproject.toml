[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policybound"
version = "0.1.0"
description = "Lightweight governance middleware for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ikilic-tech" },
]
keywords = [
    "ai",
    "agent",
    "governance",
    "policy",
    "audit",
    "compliance",
    "security",
    "middleware",
    "cryptography",
    "ed25519",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
policybound = "policybound.cli:cli"

[project.urls]
Homepage = "https://github.com/ikilic-tech/policybound"
Repository = "https://github.com/ikilic-tech/policybound"
Issues = "https://github.com/ikilic-tech/policybound/issues"
Changelog = "https://github.com/ikilic-tech/policybound/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/policybound"]

[tool.hatch.build.targets.sdist]
exclude = ["*.key", "*.pem", "*.db", "*.sqlite", ".env", ".venv", ".coverage"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
